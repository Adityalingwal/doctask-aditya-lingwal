[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "requirements-delivery-register"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.4",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "langchain-core==1.5.4",
  "langchain-openai==1.4.3",
  "langgraph==1.2.11",
  "langgraph-checkpoint-postgres==3.1.2",
  "pdfplumber==0.11.10",
  "psycopg[binary,pool]==3.2.9",
  "pydantic==2.13.4",
  "pypdf==6.16.0",
  "python-docx==1.2.0",
  "PyYAML==6.0.2",
  "pytest==8.4.1",
  "SQLAlchemy==2.0.42",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
# No run ever writes a PDF; only the test fixtures and the corpus-writing
# script do, so the writer stays out of what a run depends on.
dev = [
  "reportlab==4.5.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app", "app.*"]
